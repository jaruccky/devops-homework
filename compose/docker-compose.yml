name: devops-hw1
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${COMPOSE_BIND_IP:-0.0.0.0}:${COMPOSE_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  app:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  app_net:
    name: devops-hw1-compose
    driver: bridge
